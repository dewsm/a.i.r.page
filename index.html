<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A.I.R. | Banggyo Middle School Robotics Club</title>
<link id="fav" rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1421;--panel:#15233a;--navy:#1f2d44;--line:#2a3c58;--text:#e8eef7;--muted:#9db0ca;--acc:#7fa6d6;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1b2d4a,var(--bg) 60%) fixed;background-color:var(--bg);color:var(--text);font:400 16px/1.6 Inter,"Noto Sans KR",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,.rj{font-family:Rajdhani,Inter,sans-serif;letter-spacing:.04em}
header{position:sticky;top:0;z-index:5;background:rgba(12,20,33,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav{max-width:960px;margin:auto;display:flex;align-items:center;gap:6px;padding:8px 14px}
nav .brand{display:flex;align-items:center;gap:8px;font:700 22px Rajdhani;margin-right:auto;color:var(--text);text-decoration:none}
nav .brand img{width:30px;height:30px}
nav a.t{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font:600 16px Rajdhani;letter-spacing:.05em}
nav a.t.on{color:var(--text);background:var(--navy)}
main{flex:1;width:100%;max-width:960px;margin:auto;padding:24px 16px 40px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:18px 12px calc(26px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
.hero{text-align:center;padding:12px 0 8px}
.hero img{width:min(54vw,220px);height:auto}
.hero h1{font-size:clamp(48px,14vw,84px);line-height:1;margin:6px 0 2px;letter-spacing:.12em}
.sub{color:var(--muted);letter-spacing:.2em;text-transform:uppercase;font-size:13px}
.mean{display:flex;justify-content:center;gap:clamp(10px,4vw,34px);margin:22px 0 6px;flex-wrap:wrap}
.mean div{font:600 clamp(15px,4.2vw,22px) Rajdhani;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.mean b{color:var(--acc);font-size:1.7em;margin-right:1px}
.about{max-width:620px;margin:16px auto;text-align:center;color:#c6d3e6}
.teams{text-align:center;font:700 clamp(18px,5vw,26px) Rajdhani;letter-spacing:.06em;margin:22px 0 14px}
.teams i{color:var(--acc);font-style:normal;margin:0 8px}
.icons{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:12px 0}
.ic{width:82px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:12px}
.ic svg{width:56px;height:56px;padding:11px;background:#fff;border-radius:14px;stroke:var(--navy);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
a.ic:hover svg{transform:translateY(-3px)}
.ic.off{opacity:.35}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.bar h2{margin:0 auto 0 0;font-size:30px}
select,input,textarea{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;width:100%}
select{width:auto;font-weight:600}
.gt{font-size:24px;margin:26px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;min-width:0}
.ph{width:100%;max-width:130px;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--navy);display:grid;place-items:center;margin-bottom:10px;border:2px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph b{font:700 34px Rajdhani;color:var(--acc)}
.card h3{margin:0;font-size:20px;overflow-wrap:anywhere}
.role{margin:0 0 6px;color:var(--acc);font-size:13px;font-weight:600}
.msg{margin:0;font-size:13.5px;color:#c6d3e6;overflow-wrap:anywhere}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.yr{margin-bottom:10px}
.yh{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);font:600 26px Rajdhani;letter-spacing:.06em;padding:10px 4px;cursor:pointer;text-align:left}
.yh::before{content:"";border:6px solid transparent;border-left:10px solid var(--text);border-right:0;transition:transform .2s}
.yr.open .yh::before{transform:rotate(90deg)}
.yb{display:none;padding:14px 4px 8px;text-align:center}
.yr.open .yb{display:block}
.it{display:flex;gap:8px;align-items:flex-start;justify-content:center;padding:6px 8px;border-radius:12px;margin:2px 0}
.ib{flex:1;min-width:0}
.it.star{background:rgba(255,212,121,.07);border:1px solid rgba(255,212,121,.35)}
.it.star p{font-weight:600;color:#fff}
.st{color:#ffd479;margin-right:6px}
.lk{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:14px}
.ctl{margin:0!important;flex-wrap:nowrap}
.it .shots{margin-top:8px}
.it .shots img{height:110px}
.it.over{outline:1px dashed var(--acc)}
.it p{margin:6px 0;font-size:17px}
.mo{font:600 13px Rajdhani;letter-spacing:.08em;text-transform:uppercase;background:var(--navy);color:var(--acc);border-radius:6px;padding:1px 7px;margin-right:8px;font-style:normal}
.hd{cursor:grab;color:var(--muted);padding-top:6px}
.yb a{color:#8cb8ff}
.shots{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.shots figure{margin:0;position:relative}
.shots img{display:block;height:170px;max-width:100%;border-radius:10px;border:1px solid var(--line)}
button.b1,button.b2,button.sm{font:600 14px Inter;border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:#0c1421}
button.b2,button.sm{background:transparent;color:var(--text);border-color:var(--line)}
button.sm{padding:3px 9px;font-size:12px}
.x{color:#ffb3b3;background:none;border:0;cursor:pointer;font-size:14px;padding:4px}
.adm{display:none;position:sticky;top:0;z-index:6;background:#2b4a7a;text-align:center;font-size:13px;padding:6px}
body.admin .adm{display:block}
.tools{display:none;margin-top:10px;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
body.admin .tools{display:flex}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;width:min(92vw,400px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 10px}
dialog{max-height:90vh;overflow:auto}
dialog input[type=checkbox]{width:auto;margin-left:8px}
dialog label{display:block;font-size:13px;color:var(--muted);margin:8px 0}
dialog select{width:100%}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#1f2d44;padding:10px 16px;border-radius:12px;font-size:14px;display:none;max-width:90vw;z-index:20}
</style>
</head>

function rmImg(u){const k='/photos/',i=u?u.indexOf(k):-1;if(sb&&i>0)sb.storage.from('photos').remove([u.slice(i+k.length)])}
function ask(title,fields,btn){return new Promise(res=>{const d=document.createElement('dialog');const inp=(f,i)=>f.t==='area'?`<textarea name="f${i}" rows="3">${esc(f.v)}</textarea>`:f.t==='file'?`<input type="file" name="f${i}" accept="image/*">`:f.t==='chk'?`<input type="checkbox" name="f${i}" ${f.v?'checked':''}>`:f.t==='sel'?`<select name="f${i}">${f.o.map((o,j)=>`<option value="${j}" ${j==f.v?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="f${i}" type="${f.t||'text'}" value="${esc(f.v)}">`;
d.innerHTML=`<form><h3>${esc(title)}</h3>${fields.map((f,i)=>`<label>${esc(f.l)}${inp(f,i)}</label>`).join('')}<div class="row"><button type="button" class="b2">Cancel</button><button class="b1">${btn||'Save'}</button></div></form>`;document.body.appendChild(d);d.showModal();const done=v=>{d.close();d.remove();res(v)};d.querySelector('.b2').onclick=()=>done(null);d.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=d.querySelector('.b1');b.disabled=true;b.textContent='Working…';try{const o=[];for(let i=0;i<fields.length;i++){const el=d.querySelector(`[name=f${i}]`),t=fields[i].t;o.push(t==='file'?(el.files[0]?await upImg(el.files[0]):null):t==='chk'?el.checked:t==='sel'?+el.value:t==='password'?el.value:el.value.trim())}done(o)}catch(x){toast(x.message);b.disabled=false;b.textContent=btn||'Save'}}})}
const yearsOf=o=>Object.keys(o).sort().reverse();
const I={first:'<text x="12" y="14" text-anchor="middle" font-size="7.4" font-weight="800" fill="#1f2d44" stroke="none">FIRST</text>',web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#1f2d44"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>'};
const ic=(href,label,p,x='')=>{const s=`<svg viewBox="0 0 24 24">${p}</svg><span>${label}</span>`;return href?`<a class="ic" ${x} href="${esc(href)}" ${href.startsWith('mailto:')?'':'target="_blank" rel="noopener"'}>${s}</a>`:`<span class="ic off" title="Coming soon">${s}</span>`};
function home(){const h=D.home;return `<section class="hero"><img src="${LOGO}" alt="A.I.R. wolf logo"><h1>A.I.R.</h1><div class="sub">Banggyo Middle School</div>
<div class="mean"><div><b>A</b>rtificial</div><div><b>I</b>ntelligence</div><div><b>R</b>obot</div></div>
<p class="about">We are the robotics club of Banggyo Middle School. We design, build and program robots for the FIRST Tech Challenge, where artificial intelligence meets engineering, and a pack of curious students turns ideas into machines.</p>
<div class="teams">${h.teams.map(t=>'A.I.R. '+esc(t.n)).join('<i>|</i>')}</div>
<div class="icons">${h.teams.map(t=>ic(t.url,'A.I.R.'+t.n,I.first)).join('')}${ic(h.insta,'Instagram',I.ig)}${ic(h.email&&'mailto:'+h.email,'Email',I.mail,'data-a="mail"')}${ic(h.site,'Website',I.web)}</div>
<div class="tools"><button class="sm" data-a="eh">Edit links</button></div></section>`}
function members(){const ys=yearsOf(D.members);if(!year||!D.members[year])year=D.members[NOW]?NOW:ys[0];const Y=D.members[year]||{};
const card=(m,g,i)=>`<article class="card"><div class="ph">${m.photo?`<img src="${esc(m.photo)}" alt="">`:`<b>${esc((m.name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase())}</b>`}</div><h3>${esc(m.name)}</h3><p class="role">${esc(m.role)}</p><p class="msg">${esc(m.msg)}</p><div class="tools"><button class="sm" data-a="em" data-g="${g}" data-i="${i}">Edit</button><button class="sm" data-a="dm" data-g="${g}" data-i="${i}">Delete</button></div></article>`;
const body=year?GROUPS.map(([g,t])=>{const L=Y[g]||[];if(!L.length&&!admin)return '';return `<h3 class="gt">${t}</h3>${L.length?`<div class="grid">${L.map((m,i)=>card(m,g,i)).join('')}</div>`:'<p class="empty" style="padding:8px 0">No members yet.</p>'}<div class="tools"><button class="b1" data-a="am" data-g="${g}">+ Add to ${t}</button></div>`}).join(''):'';
return `<div class="bar"><h2>Members</h2>${ys.length?`<select id="ysel">${ys.map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select>`:''}</div>
<div class="tools" style="justify-content:flex-start;margin:0 0 6px"><button class="sm" data-a="ay">+ Year</button>${year?`<button class="sm" data-a="dy">Delete ${year}</button>`:''}</div>
${body.trim()?body:'<p class="empty">No members yet.</p>'}`}
function achievements(){const ys=yearsOf(D.ach);
return `<div class="bar"><h2>Achievements</h2></div><div class="tools" style="justify-content:flex-start;margin:0 0 14px"><button class="sm" data-a="hy">+ Year</button></div>
${ys.map(y=>{const h=D.ach[y];return `<div class="yr ${open.has(y)?'open':''}"><button class="yh" data-a="tg" data-y="${y}">${y}</button><div class="yb">
${h.items.map((it,i)=>`<div class="it${it.hi?' star':''}" data-y="${y}" data-i="${i}" ${admin?'draggable="true"':''}><span class="hd tools" title="Drag to reorder">⠿</span><div class="ib"><p>${it.hi?'<span class="st">★</span>':''}${it.m?`<em class="mo">${tag(it)}</em>`:''}${esc(it.t)}</p>${it.links.length?`<div class="lk">${it.links.map(lnk).join('')}</div>`:''}${it.photos.length?`<div class="shots">${it.photos.map((p,j)=>`<figure><a href="${esc(p)}" target="_blank" rel="noopener"><img src="${esc(p)}" alt="" loading="lazy"></a><button class="x tools" style="position:absolute;top:2px;right:2px;background:#000a" data-a="ipd" data-y="${y}" data-i="${i}" data-j="${j}">✕</button></figure>`).join('')}</div>`:''}</div><span class="tools ctl"><button class="x" data-a="mu" data-y="${y}" data-i="${i}">▲</button><button class="x" data-a="md" data-y="${y}" data-i="${i}">▼</button><button class="x" data-a="hie" data-y="${y}" data-i="${i}">✎</button><button class="x" data-a="hid" data-y="${y}" data-i="${i}">✕</button></span></div>`).join('')}
${h.links.map((l,i)=>`<div class="it"><div class="ib"><p>${lnk(l)}</p></div><span class="tools ctl"><button class="x" data-a="hld" data-y="${y}" data-i="${i}">✕</button></span></div>`).join('')}
${h.photos.length?`<div class="shots">${h.photos.map((p,i)=>`<figure><img src="${esc(p)}" alt="${y}"><button class="x tools" style="position:absolute;top:2px;right:2px;background:#000a" data-a="hpd" data-y="${y}" data-i="${i}">✕</button></figure>`).join('')}</div>`:''}
<div class="tools"><button class="sm" data-a="hi" data-y="${y}">+ Entry</button><button class="sm" data-a="hs" data-y="${y}">Sort by month (newest first)</button><button class="sm" data-a="hyd" data-y="${y}">Delete ${y}</button></div></div></div>`}).join('')||'<p class="empty">No achievements yet.</p>'}`}
function draw(){let p=location.hash.slice(1)||'home';if(!['home','members','achievements'].includes(p))p='home';document.body.classList.toggle('admin',admin);$('#adm').textContent=admin?'Admin: log out':'Admin';document.querySelectorAll('nav .t').forEach(a=>a.classList.toggle('on',a.dataset.p===p));app.innerHTML={home,members,achievements}[p]();const s=$('#ysel');if(s)s.onchange=()=>{year=s.value;draw()}}
const needYear=async o=>{const r=await ask('New year',[{l:'Year (e.g. 2027)',v:String(+NOW+1)}]);if(!r)return null;if(!/^\d{4}$/.test(r[0])||o[r[0]]){toast('Enter a new 4-digit year');return null}return r[0]};
const conf=t=>ask(t,[],'Delete').then(r=>!!r);
const MF=m=>[{l:'Name',v:m.name||''},{l:'Role',v:m.role||''},{l:'Greeting',t:'area',v:m.msg||''},{l:'Photo (leave empty to keep current)',t:'file'}];
const IF=it=>{const l=it.links||[],a=l[0]||{},b=l[1]||{};return [{l:'Month (optional)',t:'sel',o:MO,v:it.m||0},{l:'Until month (optional, only for a period)',t:'sel',o:MO.map((x,i)=>i?x:'—'),v:it.m2||0},{l:'★ Highlight',t:'chk',v:!!it.hi},{l:'What happened (award, event, activity)',t:'area',v:it.t||''},{l:'Link 1 label (e.g. Engineering note)',v:a.l||''},{l:'Link 1 URL',v:a.u||''},{l:'Link 2 label',v:b.l||''},{l:'Link 2 URL',v:b.u||''},{l:'Add a photo (optional)',t:'file'}]};
const U=u=>/^https?:\/\//i.test(u)?u:(u?'https://'+u.replace(/^[a-z]+:\/*/i,''):'');
function fill(it,r){it.m=r[0];it.m2=r[0]&&r[1]?r[1]:0;it.hi=r[2];it.t=r[3];it.links=[[r[4],r[5]],[r[6],r[7]]].filter(x=>x[0]||x[1]).map(x=>({l:x[0]||x[1],u:U(x[1])}));if(r[8])it.photos.push(r[8])}
const tag=it=>it.m?MO[it.m]+(it.m2?'–'+MO[it.m2]:''):'';
const lnk=l=>l.u?`<a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.l)}</a>`:`<span>${esc(l.l)}</span>`;
const mv=(L,i,j)=>{if(j<0||j>=L.length)return;const[x]=L.splice(i,1);L.splice(j,0,x)};
app.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,y=b.dataset.y,g=b.dataset.g,i=+b.dataset.i;let r;
if(a==='mail'){if(!isMobile()){e.preventDefault();await copyText(D.home.email);toast('Email address copied: '+D.home.email,2500)}return}
if(a==='tg'){open.has(y)?open.delete(y):open.add(y);return draw()}
if(!admin)return;
if(a==='eh'){r=await ask('Edit links',[{l:'Website URL',v:D.home.site},{l:'Instagram URL',v:D.home.insta},{l:'Email',v:D.home.email},{l:'FTC page '+D.home.teams[0].n,v:D.home.teams[0].url},{l:'FTC page '+D.home.teams[1].n,v:D.home.teams[1].url}]);if(r){Object.assign(D.home,{site:r[0],insta:r[1],email:r[2]});D.home.teams[0].url=r[3];D.home.teams[1].url=r[4];edit()}}
else if(a==='ay'){const n=await needYear(D.members);if(n){D.members[n]={coach:[],'28613':[],'39323':[]};year=n;edit()}}
else if(a==='dy'){if(await conf('Delete all members of '+year+'?')){GROUPS.forEach(([k])=>D.members[year][k].forEach(m=>rmImg(m.photo)));delete D.members[year];year=null;edit()}}
else if(a==='am'){r=await ask('Add member',MF({}));if(r&&r[0]){D.members[year][g].push({name:r[0],role:r[1],msg:r[2],photo:r[3]||''});edit()}}
else if(a==='em'){const m=D.members[year][g][i];r=await ask('Edit member',MF(m));if(r){Object.assign(m,{name:r[0],role:r[1],msg:r[2]});if(r[3]){rmImg(m.photo);m.photo=r[3]}edit()}}
else if(a==='dm'){const m=D.members[year][g][i];if(await conf('Delete '+m.name+'?')){rmImg(m.photo);D.members[year][g].splice(i,1);edit()}}
else if(a==='hy'){const n=await needYear(D.ach);if(n){D.ach[n]={items:[],links:[],photos:[]};open.add(n);edit()}}
else if(a==='hyd'){if(await conf('Delete '+y+' achievements?')){D.ach[y].items.forEach(it=>it.photos.forEach(rmImg));D.ach[y].photos.forEach(rmImg);delete D.ach[y];edit()}}
else if(a==='hi'){r=await ask('Add entry',IF({}));if(r&&r[3]){const it={m:0,m2:0,hi:false,t:'',links:[],photos:[]};fill(it,r);D.ach[y].items.push(it);edit()}}
else if(a==='hie'){const it=D.ach[y].items[i];r=await ask('Edit entry',IF(it));if(r&&r[3]){fill(it,r);edit()}}
else if(a==='hid'){const it=D.ach[y].items[i];if(await conf('Delete this entry?')){it.photos.forEach(rmImg);D.ach[y].items.splice(i,1);edit()}}
else if(a==='ipd'){const P=D.ach[y].items[i].photos,j=+b.dataset.j;rmImg(P[j]);P.splice(j,1);edit()}
else if(a==='mu'){mv(D.ach[y].items,i,i-1);edit()}
else if(a==='md'){mv(D.ach[y].items,i,i+1);edit()}
else if(a==='hs'){D.ach[y].items.sort((p,q)=>(q.m||-1)-(p.m||-1));edit()}
else if(a==='hld'){D.ach[y].links.splice(i,1);edit()}
else if(a==='hpd'){rmImg(D.ach[y].photos[i]);D.ach[y].photos.splice(i,1);edit()}});
let drag=null;
app.addEventListener('dragstart',e=>{const it=e.target.closest('.it');if(!it||!admin||!it.dataset.i)return;drag={y:it.dataset.y,i:+it.dataset.i};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','x')});
app.addEventListener('dragover',e=>{const it=e.target.closest('.it');if(drag&&it&&it.dataset.y===drag.y)e.preventDefault()});
app.addEventListener('drop',e=>{const it=e.target.closest('.it');if(!drag||!it||it.dataset.y!==drag.y)return;e.preventDefault();mv(D.ach[drag.y].items,drag.i,+it.dataset.i);drag=null;edit()});
app.addEventListener('dragend',()=>drag=null);
$('#adm').onclick=async()=>{if(!sb)return toast('Supabase is not set up yet. Fill in SUPABASE_URL and SUPABASE_ANON_KEY at the top of the script.');
if(admin){await sb.auth.signOut();admin=false;return draw()}
const r=await ask('Admin login',[{l:'Email',t:'email',v:''},{l:'Password',t:'password',v:''}],'Log in');if(!r)return;
const{error}=await sb.auth.signInWithPassword({email:r[0],password:r[1]});if(error)return toast('Login failed: '+error.message);admin=true;setStat('Admin mode');draw()};
addEventListener('hashchange',draw);
draw();
(async()=>{if(!sb)return;
const{data:s}=await sb.auth.getSession();admin=!!s.session;
const{data,error}=await sb.from('site_data').select('data').eq('id',1).maybeSingle();
if(error)toast('Could not load data: '+error.message);else if(data&&data.data)D=norm(data.data);
draw()})();
</script>
</body>
</html>
